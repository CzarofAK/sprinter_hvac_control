substitutions:
  name: relay-2ch-hvac

  # How long to wait after ignition OFF (D+ drops) before battery mode is
  # re-armed. Buffer for the OEM blower controller's after-run - tune this
  # for your vehicle.
  ignition_off_delay: 5min

packages:
  basics: !include .basics.yaml

esphome:
  name: ${name}
  friendly_name: ${name}

esp32:
  board: esp32dev
  variant: esp32

globals:
  # Battery mode is only allowed while ignition/D+ is off AND the after-run
  # timer has elapsed. See binary_sensor.ignition_active and
  # script.ignition_off_delay_script below.
  - id: battery_mode_allowed
    type: bool
    restore_value: false
    initial_value: "false"

output:
  - platform: gpio
    id: output_led
    pin: 5

  # MD30C `PWM` input (3-pin INPUT header: GND/PWM/DIR). Blower speed
  # signal, 20kHz = above the audible range and within the MD30C's max
  # 20kHz PWM spec. Only ever set via the scripts below, never directly.
  # Requires MD30C jumpers JP4=Don't Care, JP6=EXT PWM (see README).
  #
  # `DIR` is NOT wired to a GPIO at all - it's hardwired directly to GND
  # on the MD30C's INPUT header itself. Per the MD30C's control truth
  # table, PWM=High + DIR=Low drives Output A - the blower only ever
  # needs to spin one way (fan blades don't do anything useful in
  # reverse), so there's no reason to burn a GPIO and add software
  # complexity for a direction that never changes. Bonus: the MD30C
  # manual requires DIR or PWM to be LOW when power comes on - hardwiring
  # DIR to GND satisfies that unconditionally, even before the ESP32
  # boots. If the motor turns out to spin the wrong way once wired up,
  # fix it by swapping the two motor leads at the MD30C's MOTOR A/B
  # terminals - electrically identical to flipping DIR, but doesn't need
  # a config change.
  - platform: ledc
    id: pwm_motor
    pin: 4
    frequency: 20000Hz

light:
  - platform: binary
    name: LED
    id: light_led
    output: output_led

binary_sensor:
  # Vehicle running signal - wired to Mercedes Terminal 30t (a timed,
  # relay-switched permanent-positive terminal) rather than classic
  # alternator D+, galvanically isolated via a 2-channel EL817-based opto
  # isolation module down to the ESP32's 3.3V logic level - see README,
  # "D+ sense input", for the exact module wiring
  # (IVCC/SIN1/VO/OUT1/OGND). `inverted: true` because the module's
  # output is active-low (its onboard pull-up resistor holds OUT1 high;
  # the phototransistor pulls it low while Terminal 30t is active). No
  # external pull-up needed on GPIO25 - the module's own onboard R2
  # (10kΩ, VO to OUT1) does that job, powered by switch.opto_vcc below.
  #
  # Terminal 30t stays active for a long time after the vehicle is
  # actually parked (15-30+ minutes on Sprinters, by design) - much
  # longer than the OEM blower's real after-run. See
  # switch.battery_mode_override below for the manual bypass this makes
  # necessary.
  - platform: gpio
    name: "Terminal 30t Active"
    id: ignition_active
    pin:
      number: 25
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    trigger_on_initial_state: true
    on_press:
      # Terminal 30t comes on (driving, or its own long tail from a
      # previous stop) -> IMMEDIATELY back to the OEM controller, no
      # waiting, no exception. Also clears any override, so the next
      # time battery mode is wanted after parking, it's a fresh,
      # deliberate decision rather than a forgotten switch left on.
      - script.stop: ignition_off_delay_script
      - globals.set:
          id: battery_mode_allowed
          value: "false"
      - switch.turn_off: battery_mode_override
      - number.set:
          id: hvac_fan_number
          value: 0
      - script.execute: motor_disengage
    on_release:
      # Terminal 30t goes off -> start the after-run timer; only once it
      # elapses is battery mode re-armed (the OEM blower may still run on
      # briefly). In practice this timer will usually lose the race
      # against switch.battery_mode_override below, since 30t's own tail
      # is so much longer than ignition_off_delay.
      - script.execute: ignition_off_delay_script

switch:
  # Both relays sit on the blower's motor leads (see README/wiring). They
  # are NEVER actuated individually, always together via the "fan power
  # source" logic below - hence `internal: true`, so HA/the web UI only
  # ever shows a single, consistent control.
  # restore_mode ALWAYS_OFF = after boot/power loss, always fall back to
  # the relays' de-energized rest state = OEM controller (fail-safe).
  - platform: gpio
    id: relay_1
    pin: 12
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_2
    pin: 13
    internal: true
    restore_mode: ALWAYS_OFF

  # Powers the D+ opto isolation module's VO (output-side pull-up supply)
  # straight from a GPIO instead of a dedicated 3.3V rail - this board
  # doesn't break one out. Load is tiny (module's onboard 10kΩ pull-up:
  # 3.3V/10kΩ ≈ 0.33mA), nowhere near a GPIO's ~20mA safe continuous
  # rating. restore_mode ALWAYS_ON (opposite of the fail-safe switches
  # above) since this just needs to stay high permanently.
  - platform: gpio
    id: opto_vcc
    pin: 27
    internal: true
    restore_mode: ALWAYS_ON

  # Manual bypass for the Terminal 30t after-run wait. Terminal 30t stays
  # active for 15-30+ minutes after the vehicle is actually parked - far
  # longer than ignition_off_delay is meant to cover - so waiting for the
  # timer alone would make battery mode impractical to use after most
  # stops. Flip this ON to arm battery mode immediately, when you know
  # the vehicle is genuinely parked even though Terminal 30t hasn't
  # dropped yet.
  #
  # This does NOT weaken the core safety guarantee: the moment Terminal
  # 30t actually goes active again (real driving resumes), the
  # binary_sensor's on_press above forces everything back to the OEM
  # controller and turns this override back off unconditionally,
  # regardless of its state. So it can never be "the reason" battery mode
  # stays engaged while genuinely driving - it only ever skips the
  # *waiting*, never the *cutover*.
  - platform: template
    name: "Battery Mode Override (Skip After-Run Wait)"
    id: battery_mode_override
    icon: "mdi:timer-off-outline"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.stop: ignition_off_delay_script
      - globals.set:
          id: battery_mode_allowed
          value: "true"
      - logger.log: "Battery mode manually armed via override"
    turn_off_action:
      - logger.log: "Battery mode override cleared"

  # Shared internal switch for the blower's power source.
  # OFF (default/fail-safe) = OEM Sprinter controller
  # ON                      = leisure battery via the MD30C
  # Only ever driven by the scripts below - no UI element of its own.
  - platform: template
    id: fan_source_battery
    internal: true
    optimistic: false
    lambda: |-
      return id(relay_1).state && id(relay_2).state;
    turn_on_action:
      - switch.turn_on: relay_1
      - switch.turn_on: relay_2
    turn_off_action:
      - switch.turn_off: relay_1
      - switch.turn_off: relay_2

script:
  # Switches to battery mode and drives the given speed (0-100%).
  # Order matters for safety: PWM stays at 0% until AFTER the relays have
  # switched to battery, so the MD30C never sees a live PWM signal while
  # the OEM controller might still be connected to the motor.
  #
  # Note there's no separate "enable" step here (unlike the earlier
  # IBT-2-based design) - the MD30C only has PWM+DIR, no R_EN/L_EN. PWM at
  # 0% already fully stops the motor, so it doubles as the enable/disable.
  - id: motor_engage
    parameters:
      percent: int
    then:
      - output.set_level: { id: pwm_motor, level: 0% }
      - switch.turn_on: fan_source_battery
      - output.set_level:
          id: pwm_motor
          level: !lambda "return percent / 100.0f;"

  # Drives PWM to 0%, then switches the relays back to the OEM controller.
  # Exact reverse order of motor_engage.
  - id: motor_disengage
    then:
      - output.set_level: { id: pwm_motor, level: 0% }
      - switch.turn_off: fan_source_battery

  # After-run timer following ignition OFF. mode: restart -> every
  # ignition on_release resets the timer; script.stop (on ignition ON)
  # cancels it immediately.
  - id: ignition_off_delay_script
    mode: restart
    then:
      - delay: ${ignition_off_delay}
      - globals.set:
          id: battery_mode_allowed
          value: "true"
      - logger.log: "After-run timer elapsed - battery mode re-armed"

number:
  # The single user-facing control for the whole system: a 0-100% slider
  # in steps of 10 (round numbers only - no fiddly 42% on a phone).
  # 0%   (default/fail-safe) = OEM Sprinter controller active, the
  #        vehicle's own switch works normally, MD30C fully disconnected
  #        from the motor and its PWM held at 0%.
  # 10-100% = blower runs off the leisure battery/MD30C at that PWM duty.
  #
  # Note: implemented as `number` rather than the `fan:` domain on purpose
  # - ESPHome's current template fan component is trigger-/publish-state-
  # based (on_turn_on/on_speed_set fire AFTER the state was already
  # published optimistically) and has known ordering issues between
  # turn_on and set_speed (esphome/esphome#10844). For a safety-relevant
  # switch-over we want to own the exact sequence ourselves - `number`
  # with `set_action` delivers that reliably and has been stable for
  # years.
  - platform: template
    name: "HVAC Fan (Battery)"
    id: hvac_fan_number
    unit_of_measurement: "%"
    icon: "mdi:fan"
    mode: slider
    min_value: 0
    max_value: 100
    step: 10
    optimistic: true
    initial_value: 0
    restore_value: false
    set_action:
      - lambda: |-
          int percent = (int) x;
          if (percent <= 0) {
            id(motor_disengage).execute();
          } else if (!id(battery_mode_allowed)) {
            ESP_LOGW("hvac", "Battery mode not armed (ignition on or after-run timer still running)");
            id(hvac_fan_number).publish_state(0);
          } else {
            id(motor_engage).execute(percent);
          }

button:
  # Commissioning helper: a short low-speed test pulse to verify the wiring
  # (relays + MD30C) actually spins the blower before relying on the main
  # slider. If the motor spins the wrong direction, swap the two motor
  # leads at the MD30C's MOTOR A/B terminals rather than changing anything
  # here - see the DIR comment on pwm_motor above.
  - platform: template
    name: "Motor Test (3s, 25%)"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: "return id(battery_mode_allowed);"
          then:
            - switch.turn_on: fan_source_battery
            - output.set_level: { id: pwm_motor, level: 25% }
            - delay: 3s
            - script.execute: motor_disengage
          else:
            - logger.log: "Test blocked: ignition on or after-run timer still running"
