substitutions:
  name: relay-2ch-hvac

  # How long to wait after ignition OFF (D+ drops) before battery mode is
  # re-armed. Buffer for the OEM blower controller's after-run - tune this
  # for your vehicle.
  ignition_off_delay: 5min

packages:
  basics: !include .basics.yaml

esphome:
  name: ${name}
  friendly_name: ${name}

esp32:
  board: esp32dev
  variant: esp32

globals:
  # false = channel R active (RPWM/R_EN), true = channel L active
  # (LPWM/L_EN). Use the test buttons below once to determine the correct
  # rotation direction, then flip initial_value accordingly. Once that's
  # known, the unused channel can also be hardwired in hardware and
  # removed from this config.
  - id: ibt2_use_channel_l
    type: bool
    restore_value: false
    initial_value: "false"

  # Battery mode is only allowed while ignition/D+ is off AND the after-run
  # timer has elapsed. See binary_sensor.ignition_active and
  # script.ignition_off_delay below.
  - id: battery_mode_allowed
    type: bool
    restore_value: false
    initial_value: "false"

output:
  - platform: gpio
    id: output_led
    pin: 5

  # IBT-2 RPWM/LPWM: blower speed signal, depending on the active channel
  # (see ibt2_use_channel_l). 20kHz = above the audible range. Only ever
  # set via the scripts below, never directly.
  - platform: ledc
    id: pwm_rpwm
    pin: 4
    frequency: 20000Hz
  - platform: ledc
    id: pwm_lpwm
    pin: 17
    frequency: 20000Hz

light:
  - platform: binary
    name: LED
    id: light_led
    output: output_led

binary_sensor:
  # Vehicle ignition/running signal (D+ from the alternator, or terminal
  # 15 - whichever is available), galvanically isolated via a PC817C
  # optocoupler down to the ESP32's 3.3V logic level - see README,
  # "D+ sense input". `inverted: true` because the optocoupler output is
  # active-low (collector gets pulled toward GND while D+ is present).
  # GPIO34 is an input-only pin with NO internal pull-up - the external
  # 10kΩ pull-up on the collector (see README) is mandatory, otherwise the
  # pin floats.
  - platform: gpio
    name: "Ignition (D+) Active"
    id: ignition_active
    pin:
      number: 34
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    trigger_on_initial_state: true
    on_press:
      # Ignition comes on (or the engine starts) -> IMMEDIATELY back to the
      # OEM controller, no waiting, no exception.
      - script.stop: ignition_off_delay
      - globals.set:
          id: battery_mode_allowed
          value: "false"
      - select.set:
          id: hvac_fan_select
          option: "Off"
      - script.execute: ibt2_disengage
    on_release:
      # Ignition goes off -> start the after-run timer; only once it
      # elapses is battery mode re-armed (the OEM blower may still run on
      # briefly).
      - script.execute: ignition_off_delay

switch:
  # Both relays sit on the blower's motor leads (see README/wiring). They
  # are NEVER actuated individually, always together via the "fan power
  # source" logic below - hence `internal: true`, so HA/the web UI only
  # ever shows a single, consistent control.
  # restore_mode ALWAYS_OFF = after boot/power loss, always fall back to
  # the relays' de-energized rest state = OEM controller (fail-safe).
  - platform: gpio
    id: relay_1
    pin: 12
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_2
    pin: 13
    internal: true
    restore_mode: ALWAYS_OFF

  # Shared internal switch for the blower's power source.
  # OFF (default/fail-safe) = OEM Sprinter controller
  # ON                      = leisure battery via the IBT-2
  # Only ever driven by the scripts below - no UI element of its own.
  - platform: template
    id: fan_source_battery
    internal: true
    optimistic: false
    lambda: |-
      return id(relay_1).state && id(relay_2).state;
    turn_on_action:
      - switch.turn_on: relay_1
      - switch.turn_on: relay_2
    turn_off_action:
      - switch.turn_off: relay_1
      - switch.turn_off: relay_2

  # IBT-2 R_EN/L_EN: extra software interlock per channel. The H-bridge is
  # always armed only AFTER the relays have switched to battery mode, and
  # disarmed BEFORE switching back to the OEM controller (see
  # script.ibt2_engage / script.ibt2_disengage). Both internal, no UI
  # element of their own.
  - platform: gpio
    id: ibt2_r_en
    pin: 16
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ibt2_l_en
    pin: 18
    internal: true
    restore_mode: ALWAYS_OFF

script:
  # Switches to battery mode and drives the given level (1-3).
  # Order matters for safety:
  #   PWM to 0% -> relays to battery -> matching *_EN armed -> level set
  # This keeps PWM inactive while the relays are still switching, and
  # *_EN is never armed while the OEM controller might still be on the
  # motor.
  - id: ibt2_engage
    parameters:
      level: int
    then:
      - output.set_level: { id: pwm_rpwm, level: 0% }
      - output.set_level: { id: pwm_lpwm, level: 0% }
      - switch.turn_on: fan_source_battery
      - if:
          condition:
            lambda: "return id(ibt2_use_channel_l);"
          then:
            - switch.turn_on: ibt2_l_en
            - output.set_level:
                id: pwm_lpwm
                level: !lambda "return level / 3.0f;"
          else:
            - switch.turn_on: ibt2_r_en
            - output.set_level:
                id: pwm_rpwm
                level: !lambda "return level / 3.0f;"

  # Drives PWM to 0%, disables both *_EN, switches the relays back to the
  # OEM controller. Exact reverse order of ibt2_engage.
  - id: ibt2_disengage
    then:
      - output.set_level: { id: pwm_rpwm, level: 0% }
      - output.set_level: { id: pwm_lpwm, level: 0% }
      - switch.turn_off: ibt2_r_en
      - switch.turn_off: ibt2_l_en
      - switch.turn_off: fan_source_battery

  # After-run timer following ignition OFF. mode: restart -> every
  # ignition on_release resets the timer; script.stop (on ignition ON)
  # cancels it immediately.
  - id: ignition_off_delay
    mode: restart
    then:
      - delay: ${ignition_off_delay}
      - globals.set:
          id: battery_mode_allowed
          value: "true"
      - logger.log: "After-run timer elapsed - battery mode re-armed"

select:
  # The single user-facing control for the whole system.
  # "Off" (default/fail-safe) = OEM Sprinter controller active, the
  #        vehicle's own switch works normally, IBT-2 fully disconnected
  #        from the motor and disabled.
  # "Low"/"Medium"/"High"     = blower runs off the leisure battery/IBT-2.
  #
  # Note: implemented as `select` rather than the `fan:` domain on purpose
  # - ESPHome's current template fan component is trigger-/publish-state-
  # based (on_turn_on/on_speed_set fire AFTER the state was already
  # published optimistically) and has known ordering issues between
  # turn_on and set_speed (esphome/esphome#10844). For a safety-relevant
  # switch-over we want to own the exact sequence ourselves - `select`
  # with `set_action` delivers that reliably and has been stable for
  # years.
  - platform: template
    name: "HVAC Fan (Battery)"
    id: hvac_fan_select
    optimistic: true
    initial_option: "Off"
    options:
      - "Off"
      - "Low"
      - "Medium"
      - "High"
    set_action:
      - lambda: |-
          if (x == "Off") {
            id(ibt2_disengage).execute();
          } else if (!id(battery_mode_allowed)) {
            ESP_LOGW("hvac", "Battery mode not armed (ignition on or after-run timer still running)");
            id(hvac_fan_select).publish_state("Off");
          } else if (x == "Low") {
            id(ibt2_engage).execute(1);
          } else if (x == "Medium") {
            id(ibt2_engage).execute(2);
          } else if (x == "High") {
            id(ibt2_engage).execute(3);
          }

button:
  # Commissioning helper: a short low-speed test pulse per IBT-2 channel,
  # to find out which channel (R or L) spins the blower in the correct
  # (factory) direction. Set ibt2_use_channel_l above afterwards and remove
  # these buttons if you no longer need them.
  - platform: template
    name: "IBT-2 Test: Channel R (3s, 25%)"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: "return id(battery_mode_allowed);"
          then:
            - switch.turn_on: fan_source_battery
            - switch.turn_on: ibt2_r_en
            - output.set_level: { id: pwm_rpwm, level: 25% }
            - delay: 3s
            - script.execute: ibt2_disengage
          else:
            - logger.log: "Test blocked: ignition on or after-run timer still running"
  - platform: template
    name: "IBT-2 Test: Channel L (3s, 25%)"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: "return id(battery_mode_allowed);"
          then:
            - switch.turn_on: fan_source_battery
            - switch.turn_on: ibt2_l_en
            - output.set_level: { id: pwm_lpwm, level: 25% }
            - delay: 3s
            - script.execute: ibt2_disengage
          else:
            - logger.log: "Test blocked: ignition on or after-run timer still running"
